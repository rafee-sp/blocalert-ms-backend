services:

#KEYCLOAK

  keycloak-db:
    image: mysql:8.0
    container_name: keycloak-db
    ports:
      - "3307:3306"
    env_file:
      - ./keycloak/keycloak-db.env
    volumes:
      - keycloak_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - blocalert-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command: start-dev
    ports:
      - "8888:8080"
    env_file:
      - ./keycloak/keycloak.env
    environment:
      - KC_SPI_THEME_CACHE_THEMES=false
      - KC_SPI_THEME_STATIC_MAX_AGE=-1
    volumes:
      - ./keycloak/themes/blocalert:/opt/keycloak/themes/blocalert
      - ./keycloak/providers:/opt/keycloak/providers
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - blocalert-net

#APPLICATION DATABASE

  app-db:
    image: mysql:8.0
    container_name: blocalert-ms-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - app_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - blocalert-net

# REDIS

  redis:
    image: redis:8-alpine
    container_name: blocalert-ms-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - blocalert-net

# KAFKA

  kafka:
    image: apache/kafka:latest
    container_name: blocalert-ms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - blocalert-net

# OBSERVABILITY

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: blocalert-ms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - blocalert-net

  loki:
    image: grafana/loki:3.1.0
    container_name: blocalert-ms-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - blocalert-net

  tempo:
    image: grafana/tempo:2.6.0
    container_name: blocalert-ms-tempo
    user: "0:0"
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yaml
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - blocalert-net

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: blocalert-ms-alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - blocalert-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: blocalert-ms-grafana
    ports:
      - "3000:3000"
    env_file:
      - ./observability/grafana/grafana.env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - blocalert-net

# EUREKA SERVER

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: eureka-server
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - blocalert-net

# CONFIG SERVER

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: config-server
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    ports:
      - "8889:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8888/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - blocalert-net

# USER SERVICE

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    env_file:
      - ./user-service/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: user-service
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms192m"
    ports:
      - "8082:8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8082/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - blocalert-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      app-db:
        condition: service_healthy

# CRYPTO SERVICE

  crypto-service:
    build:
      context: .
      dockerfile: crypto-service/Dockerfile
    env_file:
      - ./crypto-service/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: crypto-service
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms192m"
    ports:
      - "8083:8083"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8083/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - blocalert-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy

# ALERT SERVICE

  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    env_file:
      - ./alert-service/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: alert-service
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    ports:
      - "8084:8084"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8084/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 650M
    networks:
      - blocalert-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy

# NOTIFICATION SERVICE

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    env_file:
      - ./notification-service/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: notification-service
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms192m"
    ports:
      - "8085:8085"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8085/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - blocalert-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy

# API GATEWAY

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: api-gateway
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms192m"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - blocalert-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      crypto-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

# NETWORKS
networks:
  blocalert-net:
    driver: bridge

# VOLUMES

volumes:
  keycloak_db_data:
  kafka_data:
  redis_data:
  app_db_data:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data: