spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/BlocAlert
      client:
        registration:
          user-service-client:
            client-id: ${KC_USER_CLIENT_ID}
            client-secret: ${KC_USER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          user-service-client:
            token-uri: http://keycloak:8080/realms/blocalert/protocol/openid-connect/token
  cloud:
    stream:
      bindings:
        subscriptionNotification-out-0:
          destination: subscription.notification
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/blocalert
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
          order_inserts: true
          order_updates: true
        generate_statistics: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          model: ${GEMINI_MODEL}
          temperature: 0.3


stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  price-id: ${STRIPE_PRICE_ID}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

application:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}

keycloak:
  admin:
    server-url: ${KC_SERVER_URL}
    realm: ${KC_REALM}
    client-id: ${KC_ADMIN_CLIENT_ID}
    client-secret: ${KC_ADMIN_CLIENT_SECRET}

services:
  crypto-service:
    base-url: ${CRYPTO_SERVICE_URL}
  alert-service:
    base-url: ${ALERT_SERVICE_URL}

resilience4j:
  circuitbreaker:
    instances:
      cryptoServiceCB:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      alertServiceCB:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      cryptoServiceCB:
        maxAttempts: 2
        waitDuration: 500ms
      alertServiceCB:
        maxAttempts: 2
        waitDuration: 500ms
      keycloakAdminCB:
        maxAttempts: 3
        waitDuration: 500ms
  ratelimiter:
    instances:
      assistantChat:
        limitForPeriod: 25
        limitRefreshPeriod: 60s
        timeoutDuration: 0s

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always